<h2>Add Members to {{ group.name }}</h2>

<form method="POST">
    {% csrf_token %}
    <select name="members" multiple style="height: 200px; width:100%;">
        {% for user in users %}
            <option value="{{ user.id }}">{{ user.username }}</option>
        {% endfor %}
    </select>

    <button type="submit">Add Members</button>
</form>
